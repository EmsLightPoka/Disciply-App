name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:rules
      - run: npm run build

  deploy:
    # Déploie seulement depuis main, une fois le secret FIREBASE_SERVICE_ACCOUNT ajouté au dépôt.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Vérifier la clé de service
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.KEYDISCIPLY }}
        run: test -n "$SA" || (echo "Ajoute le secret FIREBASE_SERVICE_ACCOUNT (ou KEYDISCIPLY) au dépôt (voir README)"; exit 1)
      - run: npm run build
      - name: Déployer sur Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.KEYDISCIPLY }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore --project disciply-icc --non-interactive
